<html><body style="font-family: -apple-system, Helvetica; font-size: 13px;">
<h2>Kalam is installed</h2>
<p>It's in your Applications folder and should already be open.</p>
<ul>
<li>Press <b>⌃⌥J</b> from any app to open today's entry.</li>
<li>Type <b>--</b> then Return to start a new sitting on the same day.</li>
<li>Hold <b>⌘</b> for a moment to see every shortcut.</li>
<li>The pen icon in the menu bar takes quick notes.</li>
</ul>
